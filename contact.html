<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact PNRS for pipe cold cutting and hot tapping equipment — reach us by email, Telegram or WhatsApp.">
  <title>Contact PNRS — Pipeline Repair Equipment</title>

  <!-- Шрифты с Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">

  <!-- Наш CSS файл -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== ШАПКА ========== -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">PNRS</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="contact.html" class="nav__link nav__link--active">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ========== КОНТАКТЫ ========== -->
  <main class="contact">
    <h1 class="contact__title">Get in touch</h1>
    <p class="contact__text">We are online and will reply as soon as possible.</p>

    <p class="contact__phone"><a href="tel:+79028331795">+7 902 833-17-95</a></p>
    <img class="contact__qr" src="images/qr-whatsApp.jpg" alt="WhatsApp QR code">

    <div class="contact_grid">
      <!-- EMAIL (Gmail): замените адрес в to= на свой -->
      <a class="contact-btn contact-btn--email"
        href="https://mail.google.com/mail/?view=cm&fs=1&to=614000@mail.ru&su=Enquiry%20from%20the%20PNRS%20website&body=Hello!"
        target="_blank" rel="noopener">
        ✉️ Email us
      </a>

      <!-- TELEGRAM: замените username на свой (без @) -->
      <a class="contact-btn contact-btn--telegram"
        href="https://t.me/ooonrsp" target="_blank" rel="noopener">
        ✈️ Message on Telegram
      </a>

      <!-- WHATSAPP: замените номер (только цифры, с кодом страны, без + и пробелов) -->
      <a class="contact-btn contact-btn--whatsapp"
        href="https://wa.me/79028331795?text=Hello!%20Writing%20from%20the%20PNRS%20website."
        target="_blank" rel="noopener">
        💬 Message on WhatsApp
      </a>
    </div>
  </main>

  <!-- ========== ПОДВАЛ ========== -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 LLC "PNRS". All rights reserved.</p>
      <nav class="footer__nav">
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

</body>
</html>
